services:
  # NOT: Bu servis artik VPS'e (pm2 + aaPanel nginx) tasindi, bkz Desktop/borsa_sunucu_bilgileri.txt
  - type: web
    name: bist-simulasyonu-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
