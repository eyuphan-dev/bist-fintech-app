name: Deploy to VPS

on:
  push:
    branches: [master]
  # GitHub bazen push olayını tetiklemeyebiliyor; bu durumda Actions sekmesinden
  # "Run workflow" ile deploy elle başlatılabilsin diye eklendi.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/borsa
            git pull origin master

            cd /opt/borsa/backend
            ./venv/bin/pip install -r requirements.txt -q
            pm2 restart borsa-backend

            cd /opt/borsa/frontend
            npm install --no-audit --no-fund
            # DİKKAT: burada "rm -rf .next" YAPILMAZ.
            # Eski frontend süreci hâlâ istek karşılarken .next silinince
            # "Cannot find module .next/server/middleware-manifest.json" ile
            # TÜM sayfalar build boyunca (1-2 dk) 500 dönüyordu. next build
            # çıktıyı zaten yerinde tazeler; eski sürüm build bitene kadar
            # ayakta kalır ve kesinti yalnızca restart anına (~1 sn) iner.
            #
            # Not: .next temizliği başta "eski arayüz görünüyor" sorunu için
            # eklenmişti; o sorunun gerçek nedeni aaPanel'in global nginx
            # proxy_cache'i olduğu tespit edilip kapatıldı (bkz. README).
            npm run build
            pm2 restart borsa-frontend

            pm2 save
