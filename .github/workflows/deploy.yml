name: Deploy to VPS

on:
  push:
    branches: [master]
  # GitHub bazen push olayını tetiklemeyebiliyor; bu durumda Actions sekmesinden
  # "Run workflow" ile deploy elle başlatılabilsin diye eklendi.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/borsa
            # `git pull` YERINE fetch + reset: sunucu deponun bir AYNASIDIR,
            # uzerinde yerel commit yapilmaz. `pull` birlestirme denedigi icin
            # uzak gecmis yeniden yazildiginda "divergent branches" hatasiyla
            # deploy'u kiriyordu (olculdu: 2026-08-28, gecmis temizligi sonrasi
            # deploy 128 koduyla dustu). Reset her durumda uzaktakiyle birebir
            # ayni duruma getirir.
            git fetch origin master
            git reset --hard origin/master

            cd /opt/borsa/backend
            ./venv/bin/pip install -r requirements.txt -q
            pm2 restart borsa-backend

            cd /opt/borsa/frontend
            npm install --no-audit --no-fund

            # Sıfır kesintili build: çıktı önce geçici bir dizine derlenir,
            # sonra .next ile YER DEĞİŞTİRİLİR.
            #
            # Neden: build doğrudan .next içine yazarken eski frontend süreci
            # hâlâ istek karşılıyordu ve altından değişen dosyalar yüzünden
            # TÜM sayfalar build boyunca (1-2 dk) 500 dönüyordu
            # ("Cannot find module .next/server/middleware-manifest.json").
            # Artık yıkıcı adım iki mv işlemi (milisaniye); kesinti yalnızca
            # pm2 restart anına (~1 sn) iniyor.
            rm -rf .next-build .next-old
            NEXT_DIST_DIR=.next-build npm run build
            # Build başarısızsa .next'e dokunulmaz, eski sürüm ayakta kalır.
            mv .next .next-old
            mv .next-build .next
            pm2 restart borsa-frontend
            rm -rf .next-old

            pm2 save
