name: Testler

# NE YAPAR
#   Her push ve pull request'te uygulamayi TEMIZ bir ortamda ayaga kaldirip
#   95 testlik duman testini kosar, ayrica on yuzu derler.
#
# NEDEN BOYLE KURULDU
#   Testler CI modunda (--ci) TAMAMEN YEREL ornege kosar. Uretime istek
#   atmiyoruz: CI'in isi "kod bozuldu mu" sorusunu yanitlamak, "Yahoo su an
#   ayakta mi" sorusunu degil. Uretime bagli bir CI, disaridaki bir kesintide
#   yanlis alarm uretir ve zamanla guvenilmez hale gelir.
#
#   DISABLE_SCHEDULER=1 ile zamanlanmis isler kapatilir. Acik birakilsaydi
#   uygulama acilista Yahoo, KAP, TEFAS ve 9 haber kaynagina ag istegi
#   atardi — testi yavaslatir ve dis servislere bagimli kilardi.
#
#   Veritabani bos bir SQLite'tir; init_db 165 hisseyi tohumlar ama fiyat,
#   haber ve KAP verisi yoktur. Bu yuzden CI modunda "veri bos" bulgulari
#   basarisizlik sayilmaz (bkz. smoke_test.py). CI SOZLESMEYI korur:
#   uc ayakta mi, dogru HTTP kodu donuyor mu, kimlik ve dogrulama kurallari
#   calisiyor mu.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend duman testi (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # IKI SURUM BIRDEN: uretim 3.12 calisiyor, gelistirme makinesi 3.9.
    # Kod ikisinde de calismak zorunda. Bu matris gercek bir hatayla
    # dogrulandi: `str | None` yazimi 3.12'de sorunsuz, 3.9'da import
    # aninda TypeError veriyor — yani yalnizca 3.12 test edilseydi
    # gelistirme ortamini bozan bir degisiklik fark edilmeden gecerdi.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bagimliliklari yukle
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Modul importlari (sozdizimi ve dongusel import kontrolu)
        working-directory: backend
        env:
          DISABLE_SCHEDULER: "1"
          JWT_SECRET_KEY: ci-test-anahtari-gercek-degil
        run: |
          python -m compileall -q . -x 'venv|__pycache__'
          python -c "import main, scheduler, models, schemas; print('importlar tamam')"

      - name: Test verisi tohumla
        working-directory: backend
        env:
          DISABLE_SCHEDULER: "1"
          JWT_SECRET_KEY: ci-test-anahtari-gercek-degil
        run: |
          # Bos veritabaninda ucların cogu SADECE BOS YOLDAN geciyor: fiyat
          # hesabi, % degisim, pivot, grafik, portfoy degerlemesi ve backtest
          # hic calismiyor (olculdu: 95 testin 17'si "veri yok"a dusuyor,
          # 1'i dogrudan basarisiz). Sabit tohumlu sentetik veri bu yollari
          # da kapsama alir. Bkz. ci_seed.py.
          python -c "from database import SessionLocal; import init_db, ci_seed; init_db.init_database(); ci_seed.seed(SessionLocal())"

      - name: Uygulamayi baslat
        working-directory: backend
        env:
          DISABLE_SCHEDULER: "1"
          JWT_SECRET_KEY: ci-test-anahtari-gercek-degil
        run: |
          nohup python -m uvicorn main:app --port 4000 --log-level warning > uvicorn.log 2>&1 &
          # Hazir olana kadar bekle; sabit `sleep` yerine yoklama, cunku
          # ilk acilis init_database() calistiriyor ve suresi degisken.
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4000/api/market/status > /dev/null; then
              echo "backend $i saniyede hazir"
              exit 0
            fi
            sleep 1
          done
          echo "backend 40 saniyede acilmadi, log:"
          cat uvicorn.log
          exit 1

      - name: Duman testi (95 test)
        working-directory: backend
        env:
          SMOKE_CI: "1"
        run: python smoke_test.py

      - name: Basarisizlikta uygulama loglari
        if: failure()
        working-directory: backend
        run: cat uvicorn.log

  frontend:
    name: Frontend derleme
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bagimliliklari yukle
        working-directory: frontend
        run: npm ci

      - name: Tip kontrolu
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Derle
        working-directory: frontend
        run: npm run build
